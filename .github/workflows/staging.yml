name: "CI / Staging"

# Neutralized on this fork: the MatrixAI org reusable workflow + secrets it needs don't
# exist here, so auto-running on push only produces red failures. Left for reference;
# native prebuilds are built by build-prebuilds.yml instead. Manual-dispatch only.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  use-native-library-js-staging:
    permissions:
      contents: write
      actions: write
      checks: write
      pull-requests: write
    uses: MatrixAI/.github/.github/workflows/native-library-js-staging.yml@master
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
      GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
      GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
      GIT_COMMITTER_NAME: ${{ secrets.GIT_COMMITTER_NAME }}

